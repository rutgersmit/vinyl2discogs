services:
  vinyl2discogs:
    image: ghcr.io/rutgersmit/vinyl2discogs:latest
    # build: .   # uncomment to build locally instead of pulling the image
    container_name: vinyl2discogs
    restart: unless-stopped
    env_file: .env
    # environment:
    #   PUID: 1000   # owner of ./data on the host (default 1000)
    #   PGID: 1000
    ports:
      - "8765:8000"
    volumes:
      - ./data:/data
